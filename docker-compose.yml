services:
  rapply:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
        VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
        JWT_SECRET: ${JWT_SECRET}
        CRON_SECRET: ${CRON_SECRET}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: rapply
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.rapply.rule=Host(`${DOMAIN:-rapply.voisilab.app}`)"
      - "traefik.http.routers.rapply.entrypoints=web"
      - "traefik.http.services.rapply.loadbalancer.server.port=3000"

networks:
  traefik-network:
    external: true
